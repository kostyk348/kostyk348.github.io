baseURL = "https://kostyk348.github.io"
title = "Konstantin"
theme = "PaperMod"
languageCode = "en"
defaultContentLanguage = "en"

enableInlineShortcodes = true
ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Automation Engineer - Linux Enthusiast - Graphics Programmer - AI Research Hobbyist"
  keywords = ["linux", "automation", "graphics", "ai", "embedded", "open source", "rust", "local-first"]
  author = "Konstantin"

  # Визитка на главной
  homeInfoParams.Title = "Hi, I'm Konstantin 👋"
  homeInfoParams.Content = """Systems engineer building **unusual software** at the intersection of low-level programming, graphics, automation and AI.

Core interests: **MIME-OS** — everything as a single `.eml` file (databases, apps, sync, RE tooling); deterministic real-time systems; zero-copy SIMD; agent architectures.

Recent work: [MIME-OS ecosystem](/projects/), cellular reverse engineering without Ghidra, g-tools (10× faster `strings`)."""

  socialIcons = [
    { name = "github", url = "https://github.com/kostyk348" },
    { name = "email", url = "mailto:parachuk2001@gmail.com" },
  ]

  # Theme settings
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true

